name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip zip git

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # تثبيت إصدار ثابت من Flet بدلاً من أحدث إصدار
          pip install flet==0.85.2 requests bcrypt

      - name: Build APK
        run: |
          flet build apk --yes --verbose --product "هوى الشام" --org com.hawaa

      - name: Find and copy APK
        run: |
          APK_PATH=$(find build -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "✅ Found APK at: $APK_PATH"
          mkdir -p build/apk/release
          cp "$APK_PATH" build/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hawaa-apk
          path: build/apk/release/app-release.apk
