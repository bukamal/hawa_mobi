name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip zip git

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install flet==0.90.0 requests bcrypt

      - name: Clear Flet cache
        run: rm -rf ~/.flet ~/.cache/flet

      - name: Build APK
        run: |
          flet build apk --yes --verbose --product "هوى الشام" --org com.hawaa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hawaa-apk
          path: build/apk/release/*.apk
