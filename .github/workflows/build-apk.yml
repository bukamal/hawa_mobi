name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip zip git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e extensions/flet_notifications
          python -m pip install -e .
          python - <<'PY'
          import flet, sys
          print('Python:', sys.version)
          print('Flet:', getattr(flet, '__version__', 'unknown'))
          try:
              import flet.version
              print('Recommended Flutter:', getattr(flet.version, 'flutter_version', 'unknown'))
          except Exception as e:
              print('Flutter version lookup failed:', e)
          PY

      - name: Quality gate
        run: |
          PYTHONPATH=. python tools/quality_gate.py

      - name: APK release preflight
        run: |
          PYTHONPATH=. python tools/apk_release_preflight.py

      - name: Clear Flet cache
        run: |
          rm -rf ~/.flet ~/.cache/flet build/flutter build/apk

      - name: Generate Android project and APK
        run: |
          # The first pass generates build/flutter. flutter_local_notifications
          # may require the desugaring patch before its first successful compile,
          # so retain the generated project even when that compile returns nonzero.
          set +e
          flet build apk --verbose --clear-cache \
            --product "هوى الشام" \
            --org com.hawaa
          FIRST_BUILD_EXIT=$?
          set -e
          echo "Initial Flet build exit: $FIRST_BUILD_EXIT"
          test -d build/flutter

      - name: Patch native local notifications
        run: |
          python tools/patch_android_local_notifications.py build/flutter
          FLUTTER_BIN=$(command -v flutter || true)
          if [ -z "$FLUTTER_BIN" ]; then
            FLUTTER_BIN=$(find "$HOME/.flet" "$HOME/flutter" -path "*/bin/flutter" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$FLUTTER_BIN" ]; then
            echo "Flutter executable was not found in PATH, ~/.flet, or ~/flutter"
            find "$HOME/.flet" "$HOME/flutter" -maxdepth 4 -type f -name flutter 2>/dev/null || true
            exit 1
          fi
          echo "Using Flutter: $FLUTTER_BIN"
          (cd build/flutter && "$FLUTTER_BIN" build apk --release)

      - name: Find and copy APK
        run: |
          APK_PATH=$(find build -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            find build -maxdepth 5 -type f || true
            exit 1
          fi
          echo "✅ Found APK at: $APK_PATH"
          mkdir -p build/apk/release
          cp "$APK_PATH" build/apk/release/hawaa-sham-release.apk
          PYTHONPATH=. python tools/apk_release_preflight.py build/apk/release/hawaa-sham-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hawaa-sham-apk
          path: build/apk/release/hawaa-sham-release.apk
