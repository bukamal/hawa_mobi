[project]
name = "hawaa-accounting"
version = "1.0.50"
description = "نظام حسابات هوى الشام الداخلي"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "requests>=2.25.0",
    "flet-permission-handler==0.1.0",
    "Pillow>=10.0.0",
    "cryptography==43.0.1",
    "flet-notifications==0.2.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "currency"]

[tool.setuptools.packages.find]
include = ["auth*", "database*", "i18n*", "views*", "services*", "reports*"]

[tool.flet]
permissions = ["camera", "storage"]
org = "com.hawaa"
product = "هوى الشام"
company = "Hawaa"
copyright = "Copyright (C) 2026 Hawaa"
android_permissions = [
    "android.permission.INTERNET",
    "android.permission.CAMERA",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
    "android.permission.READ_MEDIA_IMAGES",
    "android.permission.READ_MEDIA_VIDEO",
    "android.permission.READ_MEDIA_AUDIO",
    "android.permission.MANAGE_EXTERNAL_STORAGE",
    "android.permission.POST_NOTIFICATIONS",
    "android.permission.RECEIVE_BOOT_COMPLETED"
]

[tool.flet.app]
path = "."
module = "main"

[tool.setuptools.package-data]
"*" = ["assets/*.png", "assets/icons/*.png", "assets/brand/*.png", "assets/android_res/*/*.png"]

[tool.flet.splash]
color = "#0A3F70"
dark_color = "#082040"
android = true
ios = true
web = true

[tool.flet.android]
adaptive_icon_background = "#0A3F70"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.CAMERA" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true

"android.permission.READ_MEDIA_IMAGES" = true

"android.permission.READ_MEDIA_VIDEO" = true

"android.permission.READ_MEDIA_AUDIO" = true

"android.permission.MANAGE_EXTERNAL_STORAGE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[tool.flet.dev_packages]
"flet-notifications" = "extensions/flet_notifications"
