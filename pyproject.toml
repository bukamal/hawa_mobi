[project]
name = "hf-offline"
version = "0.1.0"
description = "HF — ورشة إصلاح الهاتف الذكي: أدوات تشخيص وصيانة برمجية تعمل محليًا (Flet)"
requires-python = ">=3.10"
dependencies = [
  "flet==0.85.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 320  # intentionally keep single-line Flet control trees
target-version = "py310"
exclude = ["build", "dist", "extensions"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes: unused imports/vars, undefined names, etc.
  "E9",  # syntax errors
  "B",   # bugbear: common real-world bug patterns
]
ignore = [
  "B008",  # Flet control factories in default args are intentional
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast pure-python tests (no UI runtime needed)",
  "integration: tests that build a real AppContext / database",
]

[tool.coverage.run]
source = ["hf_offline"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 10

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
org = "com.hfworkshop"
product = "HF | إتش-إف"
company = "HF Workshop"
copyright = "Copyright © 2026"
build_number = 1
android_permissions = [
  "android.permission.CAMERA",
]

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0F766E"
dark_color = "#115E59"
android = true
ios = true
web = true

[tool.flet.android]
adaptive_icon_background = "#0F766E"

[tool.flet.android.manifest_application]
allowBackup = "false"
