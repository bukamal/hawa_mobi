[project]
name = "hawaa-accounting"
version = "1.0.0"
description = "نظام حسابات هوى الشام للسياحة والسفر"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.85.0",
    "requests>=2.25.0",
    "bcrypt>=4.0.0",
]

[build-system]
requires = ["flet-core>=0.85.0"]
build-backend = "flet_core.build"

[tool.flet]
org = "com.hawaa"
product = "هوى الشام"
android_permissions = [
    "android.permission.INTERNET"
]
