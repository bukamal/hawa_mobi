[project]
name = "hawaa-accounting"
version = "1.0.8"
description = "نظام حسابات هوى الشام الداخلي"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "requests>=2.25.0",
    "flet-permission-handler>=0.1.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "currency"]

[tool.setuptools.packages.find]
include = ["auth*", "database*", "i18n*", "views*", "services*", "reports*"]

[tool.flet]
permissions = ["camera"]
org = "com.hawaa"
product = "هوى الشام"
company = "Hawaa"
copyright = "Copyright (C) 2026 Hawaa"
android_permissions = [
    "android.permission.INTERNET",
    "android.permission.CAMERA",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE"
]

[tool.flet.app]
path = "."
module = "main"

[tool.setuptools.package-data]
"*" = ["assets/*.png", "assets/icons/*.png", "assets/brand/*.png", "assets/android_res/*/*.png"]

[tool.flet.splash]
color = "#0B5F57"
dark_color = "#082040"
android = true
ios = true
web = true

[tool.flet.android]
adaptive_icon_background = "#0B5F57"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.CAMERA" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
