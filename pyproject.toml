[project]
name = "hawaa-accounting"
version = "1.0.1"
description = "نظام حسابات هوى الشام للسياحة والسفر"
requires-python = ">=3.10"
dependencies = [
    "flet==0.85.2",
    "requests>=2.25.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "currency"]

[tool.setuptools.packages.find]
include = ["auth*", "database*", "i18n*", "views*", "services*"]

[tool.flet]
org = "com.hawaa"
product = "هوى الشام"
company = "Hawaa"
copyright = "Copyright (C) 2026 Hawaa"
android_permissions = [
    "android.permission.INTERNET"
]

[tool.flet.app]
path = "."
module = "main"
